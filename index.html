<!DOCTYPE html>
<html lang="ha">
<head>
<meta name="description" content="Sayyadi Social - Social platform for connecting with friends, sharing posts, chatting and building a community.">
<meta name="keywords" content="Sayyadi Social, social network, friends, chat, community, posts">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://muhammadsayyadee39-cyber.github.io/sayyadi-social/">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayyadi Social</title>

<style>
body{margin:0;font-family:Arial;background:#f2f4f7}
.header{background:#00b86b;color:white;padding:18px;font-size:24px;font-weight:bold}
.nav{background:white;padding:12px;display:flex;gap:8px;flex-wrap:wrap}
button{background:#00b86b;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
.container{max-width:650px;margin:25px auto}
.box,.post{background:white;padding:20px;border-radius:15px;margin-bottom:20px}
textarea{width:95%;height:90px;padding:12px;border:1px solid #ccc;border-radius:10px}
.commentInput{width:65%;padding:10px;border:1px solid #ccc;border-radius:8px}
.comment{background:#f1f1f1;padding:8px;margin-top:8px;border-radius:8px}
</style>
</head>

<body>

<div class="header">🚀 Sayyadi Social</div>

<div class="nav">
<button onclick="location.href='index.html'">🏠 Home</button>
<button onclick="location.href='profile.html'">👤 Profile</button>
<button onclick="location.href='community.html'">👥 Community</button>
<button onclick="location.href='friends.html'">👥 Friends</button>
<button onclick="location.href='chat.html'">💬 Chat</button>
<button onclick="location.href='search.html'">🔍 Search</button>
<button onclick="location.href='notifications.html'">🔔 Notifications</button>
<button onclick="logout()">🚪 Logout</button>
</div>

<div class="container">

<div class="box">
<h2>Create Post 📝</h2>

<textarea id="postText" placeholder="Me kake tunani?"></textarea>
<br><br>

<button onclick="createPost()">Post 🚀</button>
</div>

<div id="feed"></div>

</div>

<script>

let posts = [];

async function loadPosts(){

try{

let response = await fetch("https://sayyadi-social.onrender.com/api/posts");
posts = await response.json();

showPosts();

}catch(error){

posts = JSON.parse(localStorage.getItem("sayyadiPosts") || "[]");

showPosts();

}
}

function showPosts(){

let feed = document.getElementById("feed");

if(posts.length === 0){

feed.innerHTML =
'<div class="post"><p>Babu post tukuna. Ka zama na farko! 🚀</p></div>';

return;
}

feed.innerHTML = posts.slice().reverse().map(function(post,index){

return `
<div class="post">

<strong>👤 ${post.name || "Sayyadi User"}</strong>

<p>${post.text}</p>

<button onclick="likePost(${index})">
❤️ Like <span>${post.likes || 0}</span>
</button>

<br><br>

<input class="commentInput" id="comment${index}" placeholder="Rubuta comment...">

<button onclick="commentPost(${index})">
💬 Comment
</button>

<div id="comments${index}"></div>

</div>
`;

}).join("");

}

async function createPost(){

let text = document.getElementById("postText").value.trim();

if(!text){

alert("Rubuta post farko ✍️");
return;
}

let name = localStorage.getItem("sayyadiName") || "Sayyadi User";

try{

let response = await fetch("https://sayyadi-social.onrender.com/api/post",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
name:name,
text:text
})

});

let data = await response.json();

document.getElementById("postText").value="";

alert(data.message || "An ajiye post! 🎉");

loadPosts();

}catch(error){

alert("An samu matsala wajen haɗa backend.");

}

}

function likePost(index){

posts[index].likes = (posts[index].likes || 0) + 1;

localStorage.setItem("sayyadiPosts",JSON.stringify(posts));

showPosts();

}

function commentPost(index){

let input = document.getElementById("comment"+index);

let text = input.value.trim();

if(!text){

alert("Rubuta comment farko ✍️");
return;
}

if(!posts[index].comments){
posts[index].comments=[];
}

posts[index].comments.push(text);

localStorage.setItem("sayyadiPosts",JSON.stringify(posts));

input.value="";

showPosts();

}

function logout(){

localStorage.clear();

location.href="login.html";

}

loadPosts();

</script>

</body>
</html>
