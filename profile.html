<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - PS Chat</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}
.header{
background:#08a85b;
color:white;
padding:20px;
font-size:24px;
font-weight:bold;
}
.nav{
padding:15px;
background:white;
}
button{
padding:10px 15px;
margin:4px;
border:0;
border-radius:8px;
cursor:pointer;
}
.box{
background:white;
max-width:500px;
margin:30px auto;
padding:25px;
border-radius:15px;
text-align:center;
}
.avatar{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
background:#ddd;
margin-bottom:15px;
}
.email{
color:#666;
}
.logout{
background:#d9534f;
color:white;
}
</style>

<style id="ps-chat-profile-gold">
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.header{
  background:#080808 !important;
  color:#d4af37 !important;
  border-bottom:1px solid #2b2410;
  padding:18px 20px !important;
  font-size:22px;
  font-weight:700;
  text-align:center;
}

.nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  background:#111;
  padding:12px;
  border-bottom:1px solid #2b2410;
}

.nav button{
  background:#181818 !important;
  color:#d4af37 !important;
  border:1px solid #3a3014 !important;
  border-radius:12px !important;
  padding:9px 14px !important;
  font-weight:600;
  cursor:pointer;
}

.nav button:hover{
  background:#d4af37 !important;
  color:#080808 !important;
}

.box{
  width:min(92%,520px);
  margin:28px auto;
  padding:28px 22px;
  background:#111;
  border:1px solid #2f2710;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
  text-align:center;
}

.avatar{
  width:120px !important;
  height:120px !important;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #d4af37;
  background:#1a1a1a;
  margin:0 auto 16px;
  display:block;
}

#name{
  color:#fff;
  font-size:25px;
  font-weight:700;
  margin:8px 0;
}

.email{
  color:#aaa !important;
  font-size:14px;
  margin-bottom:20px;
}

input[type="file"]{
  width:100%;
  margin:12px 0 18px;
  padding:10px;
  background:#181818;
  color:#ddd;
  border:1px solid #3a3014;
  border-radius:10px;
}

.logout{
  background:#e9534f !important;
  color:#fff !important;
  border:0 !important;
  border-radius:12px !important;
  padding:11px 24px !important;
  font-weight:700;
  cursor:pointer;
}

.logout:hover{
  opacity:.85;
}

@media(max-width:600px){
  .nav{
    gap:6px;
  }

  .nav button{
    font-size:13px;
    padding:8px 10px !important;
  }

  .box{
    margin:20px auto;
    padding:24px 16px;
  }
}
</style>

</head>

<body>

<div class="header">🚀 PS Chat</div>

<div class="nav">
<button onclick="location.href='index.html'">🏠 Home</button>
<button onclick="location.href='profile.html'">👤 Profile</button>
<button onclick="location.href='community.html'">👥 Community</button>
<button onclick="location.href='friends.html'">👥 Friends</button>
<button onclick="location.href='chat.html'">💬 Chat</button>
</div>

<div class="box">

<img id="avatar" class="avatar" src="" alt="Profile">

<h2 id="name">Loading...</h2>

<p id="email" class="email">Loading...</p>

<div style="display:flex;justify-content:center;gap:30px;margin:20px 0;">
  <div>
    <strong id="followers">0</strong>
    <br>
    Followers
  </div>

  <div>
    <strong id="following">0</strong>
    <br>
    Following
  </div>
</div>

<input type="file" id="photoInput" accept="image/*">

<br><br>

<button onclick="logout()" class="logout">🚪 Logout</button>

</div>

<script>

async function loadProfile(){

const email=localStorage.getItem("sayyadiEmail");

if(!email){
location.href="login.html";
return;
}

try{

const response=await fetch("https://sayyadi-social.onrender.com/api/users");
const users=await response.json();

const user=users.find(u=>u.email===email);

if(user){

document.getElementById("name").textContent=user.name;
document.getElementById("email").textContent=user.email;

}else{

document.getElementById("name").textContent="User";
document.getElementById("email").textContent=email;

}

}catch(error){

document.getElementById("name").textContent=
localStorage.getItem("sayyadiName") || "User";

document.getElementById("email").textContent=email;

}

const followsResponse = await fetch(
"https://sayyadi-social.onrender.com/api/follows"
);

const follows = await followsResponse.json();

const followers = follows.filter(
f => f.following === email
).length;

const following = follows.filter(
f => f.follower === email
).length;

document.getElementById("followers").textContent = followers;
document.getElementById("following").textContent = following;

const photo=localStorage.getItem("sayyadiPhoto");

if(photo){
document.getElementById("avatar").src=photo;
}

}

document.getElementById("photoInput").addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

localStorage.setItem("sayyadiPhoto",e.target.result);

document.getElementById("avatar").src=e.target.result;

};

reader.readAsDataURL(file);

});

function logout(){

localStorage.removeItem("sayyadiName");
localStorage.removeItem("sayyadiEmail");

location.href="login.html";

}

loadProfile();

</script>

</body>
</html>
