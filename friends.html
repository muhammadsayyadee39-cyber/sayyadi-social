<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayyadi Friends</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f2f2;
    }

    header {
      background: #111;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 10px;
    }

    .user {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .buttons {
      display: flex;
      gap: 6px;
    }

    button {
      border: none;
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .follow {
      background: #111;
      color: white;
    }

    .chat {
      background: #ddd;
      color: #111;
    }
  </style>

<style id="ps-modern-friends">
:root{
  --ps-bg:#050b14;
  --ps-card:#0b1625;
  --ps-card2:#101d2d;
  --ps-gold:#f5c542;
  --ps-text:#f8fafc;
  --ps-muted:#94a3b8;
  --ps-line:rgba(255,255,255,.08);
}

html,body{
  background:var(--ps-bg)!important;
  color:var(--ps-text)!important;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:rgba(5,11,20,.97)!important;
  border-bottom:1px solid var(--ps-line)!important;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

h1,h2,h3{
  color:#fff!important;
  letter-spacing:-.02em;
}

input{
  background:var(--ps-card2)!important;
  color:#fff!important;
  border:1px solid var(--ps-line)!important;
  border-radius:15px!important;
}

button{
  border-radius:14px!important;
  border:1px solid var(--ps-line)!important;
  transition:.2s ease;
}

button:hover{
  transform:translateY(-1px);
}

.friend,
.friend-item,
.friend-card,
.user-card,
.card,
.list-item{
  background:linear-gradient(145deg,var(--ps-card),#08111e)!important;
  border:1px solid var(--ps-line)!important;
  border-radius:18px!important;
  margin:10px 0!important;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.friend:hover,
.friend-item:hover,
.friend-card:hover,
.user-card:hover,
.card:hover,
.list-item:hover{
  border-color:rgba(245,197,66,.35)!important;
}

.online,
.status-online{
  color:#22c55e!important;
}

.badge,
.count{
  background:var(--ps-gold)!important;
  color:#111827!important;
  border-radius:999px!important;
  font-weight:800;
}

nav,
.bottom-nav,
.navbar,
footer{
  background:rgba(5,11,20,.97)!important;
  border-top:1px solid var(--ps-line)!important;
}

nav a,
.bottom-nav a,
.navbar a{
  color:var(--ps-muted)!important;
}

nav a:hover,
.bottom-nav a:hover,
.navbar a:hover,
nav a.active,
.bottom-nav a.active,
.navbar a.active{
  color:var(--ps-gold)!important;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{
  background:rgba(245,197,66,.35);
  border-radius:99px;
}
</style>

</head>

<body>

<header>
  👥 Sayyadi Friends
</header>

<div class="container">
  <div id="users">Ana loda users...</div>
</div>

<script>

const API = "https://sayyadi-social.onrender.com";

const myEmail = localStorage.getItem("sayyadiEmail");

async function loadFriends() {

  const box = document.getElementById("users");

  if (!myEmail) {
    box.innerHTML = "<p>Ka fara Login.</p>";
    return;
  }

  try {

    const usersResponse = await fetch(`${API}/api/users`);
    const users = await usersResponse.json();

    const followsResponse = await fetch(`${API}/api/follows`);
    const follows = await followsResponse.json();

    box.innerHTML = "";

    const otherUsers = users.filter(
      user => user.email !== myEmail
    );

    if (otherUsers.length === 0) {
      box.innerHTML = "<p>Babu sauran users tukuna.</p>";
      return;
    }

    otherUsers.forEach(user => {

      const isFollowing = follows.some(
        f =>
          f.follower === myEmail &&
          f.following === user.email
      );

      const div = document.createElement("div");
      div.className = "user";

      const name = document.createElement("strong");
      name.textContent = user.name;

      const buttons = document.createElement("div");
      buttons.className = "buttons";

      const followButton = document.createElement("button");
      followButton.className = "follow";
      followButton.textContent =
        isFollowing ? "Unfollow" : "Follow";

      followButton.onclick = () =>
        followUser(user.email);

      const chatButton = document.createElement("button");
      chatButton.className = "chat";
      chatButton.textContent = "💬 Chat";

      chatButton.onclick = () => {
        window.location.href =
          `userchat.html?user=${encodeURIComponent(user.email)}`;
      };

      buttons.appendChild(followButton);
      buttons.appendChild(chatButton);

      div.appendChild(name);
      div.appendChild(buttons);

      box.appendChild(div);

    });

  } catch (error) {

    box.innerHTML =
      "<p>An samu matsala wajen ɗauko Friends.</p>";

    console.error(error);
  }
}

async function followUser(email) {

  try {

    const response = await fetch(`${API}/api/follow`, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        follower: myEmail,
        following: email
      })

    });

    const result = await response.json();

    if (!response.ok) {
      alert(result.error || "An samu kuskure.");
      return;
    }

    loadFriends();

  } catch (error) {

    alert("An kasa haɗawa da backend.");
    console.error(error);
  }
}

loadFriends();

</script>

</body>
</html>
