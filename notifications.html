<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayyadi Notifications</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f2f2;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 10px;
    }

    .notification {
      background: white;
      padding: 16px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .empty {
      text-align: center;
      color: #666;
      margin-top: 40px;
    }
  </style>

<style id="ps-modern-notifications">
:root{
  --ps-bg:#050b14;
  --ps-card:#0b1625;
  --ps-card2:#101d2d;
  --ps-gold:#f5c542;
  --ps-text:#f8fafc;
  --ps-muted:#94a3b8;
  --ps-line:rgba(255,255,255,.08);
}

html,body{
  background:var(--ps-bg)!important;
  color:var(--ps-text)!important;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:rgba(5,11,20,.96)!important;
  border-bottom:1px solid var(--ps-line)!important;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

h1,h2,h3{
  color:#fff!important;
  letter-spacing:-.02em;
}

button{
  border-radius:14px!important;
  border:1px solid var(--ps-line)!important;
  transition:.2s ease;
}

button:hover{
  transform:translateY(-1px);
}

input,select,textarea{
  background:var(--ps-card2)!important;
  color:#fff!important;
  border:1px solid var(--ps-line)!important;
  border-radius:14px!important;
}

a{
  color:var(--ps-gold);
}

.notification,
.notifications-item,
.notification-item,
.card,
.activity,
.list-item{
  background:linear-gradient(145deg,var(--ps-card),#08111e)!important;
  border:1px solid var(--ps-line)!important;
  border-radius:18px!important;
  margin:10px 0!important;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.notification:hover,
.notifications-item:hover,
.notification-item:hover,
.card:hover,
.activity:hover,
.list-item:hover{
  border-color:rgba(245,197,66,.35)!important;
}

.badge,
.count,
.unread{
  background:var(--ps-gold)!important;
  color:#111827!important;
  border-radius:999px!important;
  font-weight:800;
}

nav,
.bottom-nav,
.navbar,
footer{
  background:rgba(5,11,20,.97)!important;
  border-top:1px solid var(--ps-line)!important;
}

nav a,
.bottom-nav a,
.navbar a{
  color:var(--ps-muted)!important;
}

nav a:hover,
.bottom-nav a:hover,
.navbar a:hover,
nav a.active,
.bottom-nav a.active,
.navbar a.active{
  color:var(--ps-gold)!important;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{
  background:rgba(245,197,66,.35);
  border-radius:99px;
}
</style>

</head>

<body>

<header>
  🔔 Sayyadi Notifications
</header>

<div class="container">
  <div id="notifications">
    Ana loda notifications...
  </div>
</div>

<script>

const API = "https://sayyadi-social.onrender.com";
const myEmail = localStorage.getItem("sayyadiEmail");

async function loadNotifications() {

  const box = document.getElementById("notifications");

  if (!myEmail) {
    box.innerHTML = '<p class="empty">Ka fara Login.</p>';
    return;
  }

  try {

    const response = await fetch(
      `${API}/api/notifications?user=${encodeURIComponent(myEmail)}`
    );

    const notifications = await response.json();

    if (!response.ok) {
      box.innerHTML = '<p class="empty">An samu matsala.</p>';
      return;
    }

    box.innerHTML = "";

    if (notifications.length === 0) {
      box.innerHTML =
        '<p class="empty">Babu notification tukuna 🔔</p>';
      return;
    }

    notifications.slice().reverse().forEach(notification => {

      const div = document.createElement("div");
      div.className = "notification";

      const text = document.createElement("div");
      text.textContent =
        notification.text || "Sabuwar notification 🔔";

      const from = document.createElement("small");
      from.textContent =
        notification.from
          ? `Daga: ${notification.from}`
          : "";

      div.appendChild(text);
      div.appendChild(document.createElement("br"));
      div.appendChild(from);

      box.appendChild(div);
    });

  } catch (error) {

    box.innerHTML =
      '<p class="empty">An kasa haɗawa da backend.</p>';

    console.error(error);
  }
}

loadNotifications();

</script>

</body>
</html>
