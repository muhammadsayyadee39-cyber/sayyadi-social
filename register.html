<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Chat</title>
<style>
body{margin:0;font-family:Arial;background:#050505}
.box{max-width:450px;margin:60px auto;background:#0d0d0d;padding:25px;border-radius:15px}
h1{color:#d4af37;text-align:center}
input{width:94%;padding:12px;margin:8px 0;border:1px solid #333;border-radius:8px}
button{width:100%;background:#d4af37;color:#f5f5f5;border:0;padding:13px;border-radius:8px;margin-top:10px}
a{display:block;text-align:center;margin-top:20px;color:#d4af37}
</style>
</head>
<body>

<div class="box">
<h1>🚀 PS Chat</h1>
<h2>Ƙirƙiri Account</h2>

<input id="name" placeholder="Sunanka">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register 👤</button>

<a href="login.html">Ina da account</a>
</div>

<script>
async function register(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;

if(!name || !email || !password){
alert("Cika dukkan bayanan farko.");
return;
}

try{

let response=await fetch("https://sayyadi-social.onrender.com/api/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:name,
email:email,
password:password
})
});

let data=await response.json();

localStorage.setItem("sayyadiName",name);
localStorage.setItem("sayyadiEmail",email);

alert(data.message || "An ƙirƙiri account! 🎉");
location.href="login.html";

}catch(error){

alert("Backend bai haɗu ba. Ka tabbatar backend yana aiki a port 8001.");

}
}
</script>

</body>
</html>
