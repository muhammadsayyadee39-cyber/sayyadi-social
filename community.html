<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayyadi Community</title>
<style>
body{margin:0;font-family:Arial;background:#f2f4f7}
.header{background:#00b86b;color:white;padding:18px;font-size:24px;font-weight:bold}
.box{max-width:600px;margin:30px auto;background:white;padding:20px;border-radius:15px}
.user{padding:15px;background:#f2f2f2;border-radius:10px;margin-bottom:10px}
a{color:#00a85a}
</style>

<style id="ps-modern-community">
:root{
  --ps-bg:#050b14;
  --ps-card:#0b1625;
  --ps-card2:#101d2d;
  --ps-gold:#f5c542;
  --ps-text:#f8fafc;
  --ps-muted:#94a3b8;
  --ps-line:rgba(255,255,255,.08);
}

html,body{
  background:var(--ps-bg)!important;
  color:var(--ps-text)!important;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:rgba(5,11,20,.97)!important;
  border-bottom:1px solid var(--ps-line)!important;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

h1,h2,h3{
  color:#fff!important;
  letter-spacing:-.02em;
}

input,textarea{
  background:var(--ps-card2)!important;
  color:#fff!important;
  border:1px solid var(--ps-line)!important;
  border-radius:15px!important;
}

button{
  border-radius:14px!important;
  border:1px solid var(--ps-line)!important;
  transition:.2s ease;
}

button:hover{
  transform:translateY(-1px);
}

.post,
.post-card,
.community-post,
.feed-item,
.card{
  background:linear-gradient(145deg,var(--ps-card),#08111e)!important;
  border:1px solid var(--ps-line)!important;
  border-radius:20px!important;
  margin:12px 0!important;
  padding:14px!important;
  box-shadow:0 8px 28px rgba(0,0,0,.2);
}

.post:hover,
.post-card:hover,
.community-post:hover,
.feed-item:hover,
.card:hover{
  border-color:rgba(245,197,66,.35)!important;
}

.like,
.comment,
.share,
.action{
  color:var(--ps-muted)!important;
}

.like:hover,
.comment:hover,
.share:hover,
.action:hover{
  color:var(--ps-gold)!important;
}

.badge,
.count{
  background:var(--ps-gold)!important;
  color:#111827!important;
  border-radius:999px!important;
  font-weight:800;
}

nav,
.bottom-nav,
.navbar,
footer{
  background:rgba(5,11,20,.97)!important;
  border-top:1px solid var(--ps-line)!important;
}

nav a,
.bottom-nav a,
.navbar a{
  color:var(--ps-muted)!important;
}

nav a:hover,
.bottom-nav a:hover,
.navbar a:hover,
nav a.active,
.bottom-nav a.active,
.navbar a.active{
  color:var(--ps-gold)!important;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{
  background:rgba(245,197,66,.35);
  border-radius:99px;
}
</style>

</head>
<body>

<div class="header">👥 Sayyadi Community</div>

<div class="box">
<h2>Users</h2>

<div class="user">👤 Sayyadi</div>
<div class="user">👤 New User</div>
<div class="user">👤 Community Member</div>

<a href="index.html">🏠 Komawa Home</a>
</div>

</body>
</html>
