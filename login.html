<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PS Chat</title>
<style>
body{
font-family:Arial;
background:#050505;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
background:#0d0d0d;
padding:30px;
border-radius:15px;
width:320px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}
h2{text-align:center;}
input{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
border:1px solid #333;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#d4af37;
color:#f5f5f5;
border:0;
border-radius:8px;
cursor:pointer;
}
a{
display:block;
text-align:center;
margin-top:15px;
}
</style>
</head>

<body>

<div class="box">
<h2>🚀 PS Chat</h2>
<h3>Login</h3>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<a href="register.html">Create Account</a>
</div>

<script>
async function login(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

if(!email || !password){
alert("Cika email da password");
return;
}

try{

const r=await fetch("https://sayyadi-social.onrender.com/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
});

const data=await r.json();

if(r.ok){

localStorage.setItem("sayyadiName",data.user.name);
localStorage.setItem("sayyadiEmail",data.user.email);

alert("Barka da zuwa Sayyadi! 👋");

location.href="index.html";

}else{

alert(data.error);

}

}catch(e){

alert("Backend bai haɗu ba. Ka tabbatar yana aiki a port 8001.");

}

}
</script>

</body>
</html>
