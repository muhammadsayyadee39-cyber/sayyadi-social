<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Chat</title>
<style>
body{margin:0;font-family:Arial;background:#f2f4f7}
.header{background:#00b86b;color:white;padding:18px;font-size:24px;font-weight:bold}
.box{max-width:650px;margin:25px auto;background:white;padding:20px;border-radius:15px}
input{width:65%;padding:12px;border:1px solid #ccc;border-radius:8px}
button{background:#00b86b;color:white;border:0;padding:12px 18px;border-radius:8px}
.result{background:#e8f5e9;padding:14px;margin:10px 0;border-radius:10px}
a{display:block;margin-top:20px;color:#00a85a}
</style>

<style id="ps-modern-search">
:root{
  --ps-bg:#050b14;
  --ps-card:#0b1625;
  --ps-card2:#101d2d;
  --ps-gold:#f5c542;
  --ps-text:#f8fafc;
  --ps-muted:#94a3b8;
  --ps-line:rgba(255,255,255,.08);
}

html,body{
  background:var(--ps-bg)!important;
  color:var(--ps-text)!important;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:rgba(5,11,20,.97)!important;
  border-bottom:1px solid var(--ps-line)!important;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

h1,h2,h3{
  color:#fff!important;
  letter-spacing:-.02em;
}

input,
textarea{
  background:var(--ps-card2)!important;
  color:#fff!important;
  border:1px solid var(--ps-line)!important;
  border-radius:15px!important;
  outline:none;
}

input:focus{
  border-color:rgba(245,197,66,.55)!important;
  box-shadow:0 0 0 3px rgba(245,197,66,.08);
}

button{
  border-radius:14px!important;
  border:1px solid var(--ps-line)!important;
  transition:.2s ease;
}

button:hover{
  transform:translateY(-1px);
}

.search,
.search-box,
.search-bar,
.search-result,
.result-item,
.card,
.list-item,
.recent-search{
  background:linear-gradient(145deg,var(--ps-card),#08111e)!important;
  border:1px solid var(--ps-line)!important;
  border-radius:18px!important;
  margin:10px 0!important;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.search-result:hover,
.result-item:hover,
.card:hover,
.list-item:hover,
.recent-search:hover{
  border-color:rgba(245,197,66,.35)!important;
}

.active,
.active-tab,
.selected{
  background:var(--ps-gold)!important;
  color:#111827!important;
  border-color:var(--ps-gold)!important;
}

.badge,
.count{
  background:var(--ps-gold)!important;
  color:#111827!important;
  border-radius:999px!important;
  font-weight:800;
}

nav,
.bottom-nav,
.navbar,
footer{
  background:rgba(5,11,20,.97)!important;
  border-top:1px solid var(--ps-line)!important;
}

nav a,
.bottom-nav a,
.navbar a{
  color:var(--ps-muted)!important;
}

nav a:hover,
.bottom-nav a:hover,
.navbar a:hover,
nav a.active,
.bottom-nav a.active,
.navbar a.active{
  color:var(--ps-gold)!important;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{
  background:rgba(245,197,66,.35);
  border-radius:99px;
}
</style>

</head>
<body>

<div class="header">🔍 PS Chat</div>

<div class="box">
<h2>Nemo a PS Chat</h2>

<input id="searchInput" type="text" placeholder="Nemo user ko post...">
<button onclick="search()">Search 🔍</button>

<div id="results"></div>

<a href="index.html">🏠 Komawa Home</a>
</div>

<script>
function search(){
let query = document.getElementById("searchInput").value.trim().toLowerCase();
let results = document.getElementById("results");

if(!query){
results.innerHTML = "<p>Rubuta abin da kake nema.</p>";
return;
}

let users = [
"Sayyadi",
"New User",
"Community Member"
];

let posts = [
"Maraba da zuwa PS Chat! 🚀",
"Sabon post daga PS Chat"
];

let found = [];

users.forEach(function(user){
if(user.toLowerCase().includes(query)){
found.push("👤 User: " + user);
}
});

posts.forEach(function(post){
if(post.toLowerCase().includes(query)){
found.push("📝 Post: " + post);
}
});

if(found.length === 0){
results.innerHTML = "<p>Ba a sami sakamako ba.</p>";
return;
}

results.innerHTML = found.map(function(item){
return '<div class="result">' + item + '</div>';
}).join("");
}
</script>

</body>
</html>
